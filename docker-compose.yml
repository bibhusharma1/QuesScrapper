# Service run file. `docker compose up` starts the HTTP service (UI-facing);
# `docker compose run --rm quesscrapper cli` runs the one-shot batch CLI.
# PDFs may come in via ./data/input (read-only); questions_data.json is the
# only kept artifact and is written to ./data/save.

services:
  quesscrapper:
    build: .
    image: quesscrapper:latest
    container_name: quesscrapper
    ports:
      - "8000:8000"
    volumes:
      - ./data/input:/data/input:ro
      - ./data/save:/data/save
    env_file:
      # Optional override of container defaults (e.g. your own paths);
      # if the file does not exist, the Dockerfile defaults apply.
      - path: .env
        required: false
    # Everything else (pages/images/text) goes to /tmp inside the container
    # and is destroyed when it exits — by design. See DOCS.md section 4.
