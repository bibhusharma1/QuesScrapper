# Microservice run file: `docker compose up` (or `docker compose run quesscrapper`).
# PDFs go in ./data/input (read-only), the dataset file is the only kept artifact
# and is written to ./data/save/questions_data.json.

services:
  quesscrapper:
    build: .
    image: quesscrapper:latest
    container_name: quesscrapper
    volumes:
      - ./data/input:/data/input:ro
      - ./data/save:/data/save
    env_file:
      # Optional override of container defaults (e.g. your own paths);
      # if the file does not exist, the Dockerfile defaults apply.
      - path: .env
        required: false
    # Everything else (pages/images/text) goes to /tmp inside the container
    # and is destroyed when it exits — by design. See DOCS.md section 4.
