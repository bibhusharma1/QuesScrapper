[project]
name = "quesscrapper"
version = "0.1.0"
description = "Question-bank PDF parser: scrapes raw text and figures from question papers and appends them into one JSON dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

# OCR phase dependency (ParsethePDF/ocr.py — not wired into the pipeline yet).
# Install with: uv sync --extra ocr  (needs a CUDA-enabled NVIDIA GPU)
[project.optional-dependencies]
ocr = [
    "paddleocr[doc-parser]>=3.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]


